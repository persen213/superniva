name: Build Supernova mod

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Allow the build script to run
        run: chmod +x gradlew

      - name: Build the mod
        run: ./gradlew build --no-daemon --console=plain --stacktrace

      - name: Save the finished mod
        uses: actions/upload-artifact@v4
        with:
          name: supernova-mod
          path: build/libs/*.jar
          if-no-files-found: error
